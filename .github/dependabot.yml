version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Tags after v1.43.1 declare another module path; upgrade this parser by hand.
      - dependency-name: github.com/VictoriaMetrics/VictoriaLogs
    open-pull-requests-limit: 10
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      prometheus:
        patterns: ["github.com/prometheus/*"]
      victoriametrics:
        patterns: ["github.com/VictoriaMetrics/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
