name: ci

on:
  pull_request:
  merge_group:
  push:
    branches-ignore: [main, gh-pages, "dependabot/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  artifacts:
    # The called workflow declares packages: write for its release-only image job; pull requests never push.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/artifacts.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}
      release: false

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Signed-off-by on every commit
        run: .github/scripts/dco.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
