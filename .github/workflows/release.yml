name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: version component to increment (pushes to main always bump minor)
        type: choice
        options: [minor, major]
        default: minor

permissions:
  contents: read

env:
  HELM_VERSION: v3.22.0

jobs:
  version:
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: reserve max(Chart.yaml, latest tag) + 1 by pushing its tag
        id: next
        run: echo "version=$(.github/scripts/reserve-version.sh "${{ inputs.bump || 'minor' }}" "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"

  quality:
    needs: version
    uses: ./.github/workflows/quality.yml

  artifacts:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/artifacts.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release: true
    secrets: inherit

  publish:
    needs: [version, quality, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
      chart_digest: ${{ steps.chart.outputs.digest }}
      repository: ${{ steps.repo.outputs.published }}
      published: ${{ steps.first-publication.outputs.published }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CANDIDATE: ${{ needs.artifacts.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: imjasonh/setup-crane@v0.7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: helm registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist-chart
      - name: names
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "IMAGE=ghcr.io/$owner/exitmesh-agent" >>"$GITHUB_ENV"
          echo "CHART_REPO=oci://ghcr.io/$owner/charts" >>"$GITHUB_ENV"
          echo "PAGES_URL=https://$owner.github.io/${GITHUB_REPOSITORY#*/}" >>"$GITHUB_ENV"
          go run ./internal/deploytest/releaseinfo >>"$GITHUB_ENV"
      - name: is this the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          top=$(gh release list --limit 200 --exclude-drafts --json tagName --jq '.[].tagName' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          newest=false
          [ "$(printf '%s\n%s\n' "${top:-0.0.0}" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ] && newest=true
          echo "NEWEST=$newest" >>"$GITHUB_ENV"
      - name: sign release files
        run: |
          for f in dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sbom.json dist/checksums.txt dist-chart/*.tgz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
      # Every later step publishes something under VERSION, so from here on a failure keeps the reserved tag.
      - name: first publication
        id: first-publication
        run: echo "published=true" >>"$GITHUB_OUTPUT"
      - name: tag and sign the gated image
        id: image
        run: |
          digest=${CANDIDATE##*@}
          crane tag "$CANDIDATE" "$VERSION"
          if [ "$NEWEST" = true ]; then crane tag "$CANDIDATE" latest; fi
          cosign sign --yes "$IMAGE@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=$digest" >>"$GITHUB_ENV"
      - name: push and sign the chart
        id: chart
        run: |
          helm push "dist-chart/exitmesh-agent-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee helm-push.txt
          digest=$(sed -n 's/^Digest: //p' helm-push.txt)
          [ -n "$digest" ] || { echo "no chart digest" >&2; exit 1; }
          cosign sign --yes "${CHART_REPO#oci://}/exitmesh-agent@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "CHART_DIGEST=$digest" >>"$GITHUB_ENV"
      - name: signed APT and YUM repository on GitHub Pages
        id: repo
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$PACKAGE_SIGNING_KEY" ]; then
            echo "::warning::PACKAGE_SIGNING_KEY is not set: the package repository was not updated"
            echo "published=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q createrepo-c dpkg-dev apt-utils
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          export GPG_KEY_ID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Concurrent releases race on gh-pages; rebuild the metadata on the new tip and push again.
          for attempt in 1 2 3 4 5; do
            git worktree remove --force pages 2>/dev/null || true
            if git fetch -q origin gh-pages; then
              git worktree add -q --detach pages FETCH_HEAD
            else
              git worktree add -q --orphan -b "pages-$attempt" pages
            fi
            REPO_URL="$PAGES_URL" .github/scripts/package-repo.sh pages dist
            git -C pages add -A
            git -C pages commit -q -m "packages: v$VERSION"
            if git -C pages push -q origin HEAD:refs/heads/gh-pages; then
              echo "published=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not update gh-pages" >&2
          exit 1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat >notes.md <<NOTES
          |Contract|Version|
          |---|---|
          |History Protocol|$EXITMESH_PROTOCOL_VERSION|
          |State schema|$EXITMESH_SCHEMA_VERSION|
          |Rule engine|$EXITMESH_ENGINE_VERSION|

          Built from \`$GITHUB_SHA\`.

          ### Kubernetes

          |Artifact|Reference|
          |---|---|
          |Container image|\`$IMAGE:$VERSION@$IMAGE_DIGEST\`|
          |Helm chart|\`$CHART_REPO/exitmesh-agent\` version \`$VERSION\`, digest \`$CHART_DIGEST\`|

          \`\`\`sh
          helm upgrade --install exitmesh-agent $CHART_REPO/exitmesh-agent --version $VERSION --namespace default --reuse-values --set image.digest=$IMAGE_DIGEST
          \`\`\`

          ### Linux hosts

          \`\`\`sh
          # Debian and Ubuntu
          sudo apt-get update && sudo apt-get install exitmesh-agent=$VERSION
          # RHEL, Rocky, Alma, Fedora, Amazon Linux
          sudo dnf install exitmesh-agent-$VERSION
          \`\`\`

          Package repository: $PAGES_URL (see docs/install-host.md). The tarballs, deb, and rpm files are attached below.

          ### Verify

          \`\`\`sh
          cosign verify $IMAGE@$IMAGE_DIGEST --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify ${CHART_REPO#oci://}/exitmesh-agent@$CHART_DIGEST --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          NOTES
          gh release create "v$VERSION" --verify-tag --latest="$NEWEST" --title "v$VERSION" --notes-file notes.md \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sbom.json dist/checksums.txt dist-chart/*.tgz \
            dist/*.sigstore.json dist-chart/*.sigstore.json
      - name: record the version in Chart.yaml on main
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: .github/scripts/release-push.sh "$VERSION"

  verify:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
      CHART_DIGEST: ${{ needs.publish.outputs.chart_digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: helm registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
      - name: signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          identity="^https://github.com/$GITHUB_REPOSITORY/"
          issuer=https://token.actions.githubusercontent.com
          cosign verify "ghcr.io/$owner/exitmesh-agent@$IMAGE_DIGEST" --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          cosign verify "ghcr.io/$owner/charts/exitmesh-agent@$CHART_DIGEST" --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          gh release download "v$VERSION" --dir rel --pattern 'checksums.txt*'
          cosign verify-blob rel/checksums.txt --bundle rel/checksums.txt.sigstore.json --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer"
      - name: published chart renders with the published image
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          mkdir -p pulled
          helm pull "oci://ghcr.io/$owner/charts/exitmesh-agent" --version "$VERSION" --destination pulled
          helm template exitmesh-agent pulled/exitmesh-agent-"$VERSION".tgz --namespace default \
            --set endpoint=https://cp.example.com --set enrollment.token=emx1_c_t-verify_abcdefghijklmnop \
            --set-json 'trust.roots=["verify-root:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="]' \
            --set image.digest="$IMAGE_DIGEST" | grep -q "exitmesh-agent@$IMAGE_DIGEST"
      - name: install from the published package repository
        if: needs.publish.outputs.repository == 'true'
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          url="https://$owner.github.io/${GITHUB_REPOSITORY#*/}"
          for i in $(seq 1 30); do curl -fsS "$url/apt/dists/stable/InRelease" | grep -q "exitmesh-agent" && break || sleep 10; done
          docker run --rm debian:12 sh -ec "
            apt-get update -q && apt-get install -y -q curl ca-certificates gnupg
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL $url/exitmesh-archive-keyring.gpg -o /etc/apt/keyrings/exitmesh-archive-keyring.gpg
            curl -fsSL $url/exitmesh-agent.sources -o /etc/apt/sources.list.d/exitmesh-agent.sources
            apt-get update -q
            apt-get install -y -q --no-install-recommends exitmesh-agent=$VERSION
            exitmesh-agent version | grep -q $VERSION"
          docker run --rm rockylinux:9 sh -ec "
            curl -fsSL $url/exitmesh-agent.repo -o /etc/yum.repos.d/exitmesh-agent.repo
            dnf install -y --setopt=install_weak_deps=False exitmesh-agent-$VERSION
            exitmesh-agent version | grep -q $VERSION"

  unreserve:
    needs: [version, publish]
    if: ${{ always() && needs.version.result == 'success' && needs.publish.outputs.published != 'true' && needs.publish.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: release the reserved tag of a run that published nothing
        run: .github/scripts/unreserve-version.sh "$VERSION" "$GITHUB_SHA"
