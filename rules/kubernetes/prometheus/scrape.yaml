groups:
  - name: scrape-targets
    rules:
      - alert: ScrapeTargetSeriesSpike
        expr: |
          scrape_samples_scraped > 2 * avg_over_time(scrape_samples_scraped[1h] offset 10m)
          and scrape_samples_scraped - avg_over_time(scrape_samples_scraped[1h] offset 10m) > 1000
        for: 10m
        annotations:
          summary: "Scrape target {{ $labels.instance }} ({{ $labels.job }}) exposes a sudden surge of series"
      - alert: KubeletScrapeDown
        expr: |
          up{job="kubelet"} == 0
        for: 5m
        keep_firing_for: 2m
        annotations:
          summary: "The agent cannot scrape the kubelet {{ $labels.metrics_path }} endpoint on {{ $labels.node }}"
