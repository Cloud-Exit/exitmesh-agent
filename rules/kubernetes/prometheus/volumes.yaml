groups:
  - name: volumes
    rules:
      - alert: PersistentVolumeSaturation
        expr: |
          kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes >= 0.9
        for: 5m
        keep_firing_for: 5m
        annotations:
          summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is almost full"
      - alert: PersistentVolumeFillingUp
        expr: |
          kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.4
          and predict_linear(kubelet_volume_stats_available_bytes[1h], 4 * 3600) < 0
        for: 15m
        keep_firing_for: 5m
        annotations:
          summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is predicted to fill within 4 hours"
