{{- $v := .Values -}}
{{- $name := include "exitmesh.coordinatorName" . -}}
{{- $lookbackMounts := false -}}
{{- range $l := $v.lookback -}}
{{- if or (and $l.bearerToken $l.bearerToken.secretName) (and $l.basicAuth $l.basicAuth.secretName) (and $l.ca (or $l.ca.secretName $l.ca.configMapName)) -}}
{{- $lookbackMounts = true -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $v.namespaces.coordinator }}
  labels:
    {{- include "exitmesh.labels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "exitmesh.selectorLabels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
  ports:
    - name: node-api
      port: {{ $v.nodeAPI.port }}
      targetPort: node-api
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $v.namespaces.coordinator }}
  labels:
    {{- include "exitmesh.labels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "exitmesh.selectorLabels" (dict "ctx" . "component" "coordinator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exitmesh.labels" (dict "ctx" . "component" "coordinator") | nindent 8 }}
        {{- with $v.coordinator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        {{- with $v.coordinator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $v.coordinator.terminationGracePeriodSeconds }}
      {{- with $v.coordinator.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "exitmesh.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $v.node.uid }}
        runAsGroup: {{ $v.node.gid }}
        fsGroup: {{ $v.node.gid }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: {{ include "exitmesh.image" . }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args: ["run", "--config", "/etc/exitmesh/config/agent.yaml"]
          ports:
            - name: node-api
              containerPort: {{ $v.nodeAPI.port }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EXITMESH_NODE_NAMESPACE
              value: {{ .Values.namespaces.node | quote }}
            - name: EXITMESH_NODE_SERVICE_ACCOUNT
              value: {{ include "exitmesh.nodeName" . | quote }}
            {{- include "exitmesh.goMemLimitEnv" (dict "container" "coordinator") | nindent 12 }}
          resources:
            {{- toYaml $v.coordinator.resources | nindent 12 }}
          securityContext:
            {{- include "exitmesh.restrictedContainerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/exitmesh/config
              readOnly: true
            - name: enrollment
              mountPath: /etc/exitmesh/enrollment
              readOnly: true
            - name: tls
              mountPath: /etc/exitmesh/tls
              readOnly: true
            {{- if and $v.airgap.enabled $v.airgap.bundles.configMap }}
            {{- range $f := $v.airgap.bundles.files }}
            - name: bundles
              mountPath: /etc/exitmesh/bundles/{{ $f }}
              subPath: {{ $f }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $lookbackMounts }}
            - name: lookback-credentials
              mountPath: /etc/exitmesh/lookback
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: enrollment
          secret:
            secretName: {{ include "exitmesh.enrollmentSecretName" . }}
            defaultMode: 0440
            items:
              - key: {{ include "exitmesh.enrollmentSecretKey" . }}
                path: token
        - name: tls
          secret:
            secretName: {{ include "exitmesh.tlsSecretName" . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if and $v.airgap.enabled $v.airgap.bundles.configMap }}
        - name: bundles
          configMap:
            name: {{ $v.airgap.bundles.configMap }}
        {{- end }}
        {{- if $lookbackMounts }}
        - name: lookback-credentials
          projected:
            defaultMode: 0440
            sources:
              {{- range $l := $v.lookback }}
              {{- if and $l.bearerToken $l.bearerToken.secretName }}
              - secret:
                  name: {{ $l.bearerToken.secretName }}
                  items:
                    - key: {{ $l.bearerToken.key }}
                      path: {{ $l.name }}/bearer-token
              {{- end }}
              {{- if and $l.basicAuth $l.basicAuth.secretName }}
              - secret:
                  name: {{ $l.basicAuth.secretName }}
                  items:
                    - key: {{ default "username" $l.basicAuth.usernameKey }}
                      path: {{ $l.name }}/username
                    - key: {{ default "password" $l.basicAuth.passwordKey }}
                      path: {{ $l.name }}/password
              {{- end }}
              {{- if and $l.ca $l.ca.secretName }}
              - secret:
                  name: {{ $l.ca.secretName }}
                  items:
                    - key: {{ default "ca.crt" $l.ca.key }}
                      path: {{ $l.name }}/ca.crt
              {{- else if and $l.ca $l.ca.configMapName }}
              - configMap:
                  name: {{ $l.ca.configMapName }}
                  items:
                    - key: {{ default "ca.crt" $l.ca.key }}
                      path: {{ $l.name }}/ca.crt
              {{- end }}
              {{- end }}
        {{- end }}
      {{- with $v.coordinator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.coordinator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.coordinator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "exitmesh.selectorLabels" (dict "ctx" . "component" "coordinator") | nindent 10 }}
      spec:
        accessModes: [{{ $v.coordinator.persistence.accessMode | quote }}]
        {{- with $v.coordinator.persistence.storageClassName }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ include "exitmesh.persistenceSize" . }}
